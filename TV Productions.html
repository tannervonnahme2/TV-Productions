/* ─── STATIC NOISE CANVAS ────────────────────────────────── */
function NoiseCanvas({ opacity = 0.045 }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let id;
    const draw = () => {
      canvas.width = canvas.offsetWidth || 400;
      canvas.height = canvas.offsetHeight || 400;
      const img = ctx.createImageData(canvas.width, canvas.height);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      id = requestAnimationFrame(draw);
    };
    draw();
    return () => cancelAnimationFrame(id);
  }, []);
  return <canvas ref={ref} style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity, pointerEvents:'none' }} />;
}

/* ─── ANIMATED LOGO BACKGROUND ───────────────────────────── */
function LogoStaticBg() {
  const staticRef = React.useRef(null);
  const glowRef   = React.useRef(null);

  React.useEffect(() => {
    const canvas = staticRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // Screen area as fraction of canvas size (retro TV: screen is center body region)
    // Logo is a TV set; screen occupies roughly x:22%-78%, y:40%-74%
    const SX = 0.22, SY = 0.40, SW = 0.56, SH = 0.34;

    let animId;
    let visible = false;
    let frameCount = 0;
    let holdFrames = 0;    // frames to stay in current state
    let nextHold = 0;

    const scheduleNext = () => {
      if (visible) {
        // Stay visible 3–8 frames (~50–130ms)
        nextHold = 3 + Math.floor(Math.random() * 6);
      } else {
        // Stay hidden 60–200 frames (~1–3.3s)
        nextHold = 60 + Math.floor(Math.random() * 140);
      }
    };
    scheduleNext();

    const SIZE = 256; // internal resolution for noise

    const draw = () => {
      animId = requestAnimationFrame(draw);
      frameCount++;

      const W = canvas.width  = canvas.offsetWidth  || 400;
      const H = canvas.height = canvas.offsetHeight || 400;

      ctx.clearRect(0, 0, W, H);

      if (holdFrames >= nextHold) {
        visible = !visible;
        holdFrames = 0;
        scheduleNext();
      }
      holdFrames++;

      if (!visible) return;

      // Screen rectangle in canvas px
      const sx = W * SX, sy = H * SY, sw = W * SW, sh = H * SH;

      // Draw static noise clipped to screen region
      const offCanvas = document.createElement('canvas');
      offCanvas.width  = SIZE;
      offCanvas.height = SIZE;
      const off = offCanvas.getContext('2d');
      const img = off.createImageData(SIZE, SIZE);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v;
        img.data[i+3] = 220;
      }
      off.putImageData(img, 0, 0);

      ctx.save();
      // Rounded clip for screen shape
      const r = sw * 0.06;
      ctx.beginPath();
      ctx.moveTo(sx + r, sy);
      ctx.lineTo(sx + sw - r, sy);
      ctx.quadraticCurveTo(sx + sw, sy, sx + sw, sy + r);
      ctx.lineTo(sx + sw, sy + sh - r);
      ctx.quadraticCurveTo(sx + sw, sy + sh, sx + sw - r, sy + sh);
      ctx.lineTo(sx + r, sy + sh);
      ctx.quadraticCurveTo(sx, sy + sh, sx, sy + sh - r);
      ctx.lineTo(sx, sy + r);
      ctx.quadraticCurveTo(sx, sy, sx + r, sy);
      ctx.closePath();
      ctx.clip();

      // Static fill
      ctx.globalAlpha = 0.72;
      ctx.drawImage(offCanvas, sx, sy, sw, sh);

      // Scanlines overlay
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#000';
      for (let y = sy; y < sy + sh; y += 3) {
        ctx.fillRect(sx, y, sw, 1);
      }

      // Subtle red tint flash occasionally
      if (Math.random() < 0.15) {
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#FF2D20';
        ctx.fillRect(sx, sy, sw, sh);
      }

      ctx.restore();
    };

    draw();
    return () => cancelAnimationFrame(animId);
  }, []);

  // Glow pulse behind screen
  React.useEffect(() => {
    const el = glowRef.current;
    if (!el) return;
    let start = null;
    let raf;
    const pulse = (ts) => {
      if (!start) start = ts;
      const t = ((ts - start) % 3000) / 3000;
      const glow = 0.03 + 0.04 * Math.sin(t * Math.PI * 2);
      el.style.opacity = glow;
      raf = requestAnimationFrame(pulse);
    };
    raf = requestAnimationFrame(pulse);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', zIndex:1 }}>
      {/* Large faint logo */}
      <div style={{ position:'relative', width:'min(520px, 65vw)', height:'min(520px, 65vw)' }}>
        <img
          src="assets/TV_Logo_white.png"
          style={{ position:'absolute', inset:0, width:'100%', height:'100%', filter:'invert(1)', opacity:0.06 }}
          alt=""
          aria-hidden="true"
        />
        {/* Glow layer */}
        <div ref={glowRef} style={{
          position:'absolute', inset:0,
          backgroundImage:'radial-gradient(ellipse 55% 35% at 50% 57%, #FF2D2022 0%, transparent 70%)',
          opacity:0.04,
        }} />
        {/* Static canvas, same size as logo container */}
        <canvas ref={staticRef} style={{ position:'absolute', inset:0, width:'100%', height:'100%' }} />
      </div>
    </div>
  );
}

/* ─── 3D LOGO BACKGROUND ─────────────────────────────────── */
function TVLogo3D() {
  const mountRef = React.useRef(null);
  const rafRef   = React.useRef(null);
  const scrollRef = React.useRef(0);

  React.useEffect(() => {
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      scrollRef.current = max > 0 ? window.scrollY / max : 0;
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, []);

  React.useEffect(() => {
    const mount = mountRef.current;
    if (!mount || typeof THREE === 'undefined') return;
    let W = mount.clientWidth;
    let H = mount.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
    camera.position.set(0, 0.5, 10.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.physicallyCorrectLights = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);
    mount.appendChild(renderer.domElement);

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.42, metalness: 0.05,
      clearcoat: 0.4, clearcoatRoughness: 0.3,
    });

    const EXT = { depth: 0.55, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.04, bevelSegments: 3 };
    const geos = [];

    function rrPath(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }
    function extrudeMesh(shape) {
      const g = new THREE.ExtrudeGeometry(shape, EXT);
      geos.push(g);
      const m = new THREE.Mesh(g, mat);
      m.position.z = -EXT.depth / 2;
      m.castShadow = true; m.receiveShadow = true;
      return m;
    }

    const group = new THREE.Group();

    // Frame
    const TW = 4, TH = 3, STROKE = 0.30, R_OUT = 0.38, R_IN = 0.20;
    const frameShape = new THREE.Shape();
    rrPath(frameShape, -TW / 2, -TH / 2, TW, TH, R_OUT);
    const hole = new THREE.Path();
    rrPath(hole, -(TW / 2 - STROKE), -(TH / 2 - STROKE), TW - STROKE * 2, TH - STROKE * 2, R_IN);
    frameShape.holes.push(hole);
    group.add(extrudeMesh(frameShape));

    // Antennae
    const ANT_BASE_X = 0.18, ANT_BASE_Y = TH / 2;
    const ANT_TIP_X  = 1.05, ANT_TIP_Y  = 2.85;
    const ANT_DX = ANT_TIP_X - ANT_BASE_X;
    const ANT_DY = ANT_TIP_Y - ANT_BASE_Y;
    const ANT_LEN = Math.sqrt(ANT_DX * ANT_DX + ANT_DY * ANT_DY);
    const ANT_ANGLE = Math.atan2(ANT_DX, ANT_DY);
    const ANT_MID_X = (ANT_BASE_X + ANT_TIP_X) / 2;
    const ANT_MID_Y = (ANT_BASE_Y + ANT_TIP_Y) / 2;
    const ANT_R = 0.058;
    function makeAntenna(signX) {
      const cylGeo = new THREE.CylinderGeometry(ANT_R, ANT_R, ANT_LEN, 14);
      const capGeo = new THREE.SphereGeometry(ANT_R, 10, 6);
      geos.push(cylGeo, capGeo);
      const cyl = new THREE.Mesh(cylGeo, mat);
      const capT = new THREE.Mesh(capGeo, mat);
      const capB = new THREE.Mesh(capGeo, mat);
      capT.position.y =  ANT_LEN / 2;
      capB.position.y = -ANT_LEN / 2;
      [cyl, capT, capB].forEach(m => { m.castShadow = true; m.receiveShadow = true; });
      const ant = new THREE.Group();
      ant.add(cyl, capT, capB);
      ant.position.set(signX * ANT_MID_X, ANT_MID_Y, 0);
      ant.rotation.z = -signX * ANT_ANGLE;
      return ant;
    }
    group.add(makeAntenna(-1));
    group.add(makeAntenna( 1));

    // T
    const tShape = new THREE.Shape();
    const TLW = 0.73, TBH = 0.155, TSW = 0.088, TAH = 0.42;
    tShape.moveTo(-TLW, TAH); tShape.lineTo(TLW, TAH);
    tShape.lineTo(TLW, TAH - TBH); tShape.lineTo(TSW, TAH - TBH);
    tShape.lineTo(TSW, -TAH); tShape.lineTo(-TSW, -TAH);
    tShape.lineTo(-TSW, TAH - TBH); tShape.lineTo(-TLW, TAH - TBH);
    tShape.closePath();
    const tMesh = extrudeMesh(tShape);
    tMesh.position.x = -0.58;
    group.add(tMesh);

    // V
    const vShape = new THREE.Shape();
    const VOW = 0.73, VIW = 0.50, VTY = 0.42, VOB = -0.45, VIB = -0.29;
    vShape.moveTo(-VOW, VTY); vShape.lineTo(-VIW, VTY);
    vShape.lineTo(0, VIB); vShape.lineTo(VIW, VTY); vShape.lineTo(VOW, VTY);
    vShape.lineTo(0, VOB); vShape.closePath();
    const vMesh = extrudeMesh(vShape);
    vMesh.position.x = 0.58;
    group.add(vMesh);

    const baseY = -(ANT_TIP_Y + (-TH / 2)) / 2;
    group.position.y = baseY;
    scene.add(group);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.22));
    const hemi = new THREE.HemisphereLight(0xfffaf5, 0x3a4458, 0.4);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfffaf0, 3.0);
    key.position.set(4, 6, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
    key.shadow.camera.left = -5; key.shadow.camera.right = 5;
    key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
    key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xb8d4ff, 0.7);
    fill.position.set(-5, -2, 4); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 1.8);
    rim.position.set(-2, 3, -6); scene.add(rim);
    const accent = new THREE.PointLight(0xff2d20, 10, 8, 2);
    accent.position.set(0, -2.5, 3); scene.add(accent);

    // Animation, CONSTANT spin, position tracks page scroll progress
    const clock = new THREE.Clock();
    const TOP_Y = baseY + 1.5;
    const BOT_Y = baseY - 1.8;
    const animate = () => {
      rafRef.current = requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();
      const progress = scrollRef.current || 0;
      group.rotation.y += dt * (Math.PI * 2 / 14);
      group.rotation.x = Math.sin(t * Math.PI / 6) * (3 * Math.PI / 180);
      group.position.y = TOP_Y + (BOT_Y - TOP_Y) * progress;
      renderer.render(scene, camera);
    };
    animate();

    const onResize = () => {
      W = mount.clientWidth; H = mount.clientHeight;
      camera.aspect = W / H; camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', onResize);
      geos.forEach(g => g.dispose());
      mat.dispose();
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, []);

  return <div ref={mountRef} style={{
    position:'fixed', inset:0, width:'100vw', height:'100vh',
    pointerEvents:'none', zIndex:-1, opacity:0.55,
  }} />;
}

    width:'100%', background:'#141414', border:`1px solid ${focused===name ? accent : N}`,

    fontFamily:"'Space Grotesk',sans-serif", outline:'none',
    transition:'border-color 150ms', resize:'vertical',
  });

  const handleSubmit = (e) => {
    e.preventDefault();
    setSent(true);
  };

  return (
    <section id="contact" style={{ background: S, padding:'96px 40px', borderTop:`1px solid ${N}` }}>
      <div style={{ maxWidth:1200, margin:'0 auto', display:'grid', gridTemplateColumns:'1fr 1fr', gap:80 }}>
        {/* Left */}
        <div>
          <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:11, fontWeight:600, letterSpacing:'0.18em', textTransform:'uppercase', color:G, marginBottom:8 }}>Let's Work</div>
          <h2 style={{ fontFamily:"'BebasNeue',sans-serif", fontSize:56, letterSpacing:'0.04em', color:W, lineHeight:1, marginBottom:24 }}>
            START A<br/><span style={{ color:accent }}>PROJECT</span>
          </h2>
          <p style={{ fontSize:15, lineHeight:1.9, color:SL, marginBottom:40 }}>
            Tell us what you're building. We'll respond within 24 hours with a strategy and quote.
          </p>

          <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
            {[
              { icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>, label:'Email', value:'tannervonnahme2@gmail.com' },
              { icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>, label:'Instagram', value:'@_tvproductions' },
            ].map(({ icon, label, value }) => (
              <div key={label} style={{ display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ width:36, height:36, borderRadius:4, background:N, display:'flex', alignItems:'center', justifyContent:'center', color:G, flexShrink:0 }}>{icon}</div>
                <div>
                  <div style={{ fontSize:10, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G }}>{label}</div>
                  <div style={{ fontSize:13, color:SL }}>{value}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Form */}
        <div>
          {sent ? (
            <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:16, padding:'60px 0' }}>
              <div style={{ fontFamily:"'BebasNeue',sans-serif", fontSize:52, color:accent, letterSpacing:'0.04em', lineHeight:1 }}>GOT IT.</div>
              <p style={{ fontSize:15, color:SL, maxWidth:320, lineHeight:1.7 }}>We'll review your brief and come back to you within 24 hours with next steps.</p>
              <button onClick={() => setSent(false)} style={{ background:'transparent', color:G, border:`1px solid ${N}`, borderRadius:4, padding:'8px 20px', fontFamily:"'Space Grotesk',sans-serif", fontSize:13, cursor:'pointer', marginTop:8 }}>Send another</button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', gap:16 }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G, display:'block', marginBottom:6 }}>Name</label>
                  <input required style={fieldStyle('name')} placeholder="Your name" value={form.name} onChange={e => setForm(f=>({...f, name:e.target.value}))} onFocus={() => setFocused('name')} onBlur={() => setFocused(null)} />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G, display:'block', marginBottom:6 }}>Email</label>
                  <input required type="email" style={fieldStyle('email')} placeholder="you@company.com" value={form.email} onChange={e => setForm(f=>({...f, email:e.target.value}))} onFocus={() => setFocused('email')} onBlur={() => setFocused(null)} />
                </div>
              </div>
              <div>
                <label style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G, display:'block', marginBottom:6 }}>Company / Brand</label>
                <input style={fieldStyle('company')} placeholder="Optional" value={form.company} onChange={e => setForm(f=>({...f, company:e.target.value}))} onFocus={() => setFocused('company')} onBlur={() => setFocused(null)} />
              </div>
              <div>
                <label style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G, display:'block', marginBottom:6 }}>Service</label>
                <select style={{ ...fieldStyle('service'), cursor:'pointer' }} value={form.service} onChange={e => setForm(f=>({...f, service:e.target.value}))} onFocus={() => setFocused('service')} onBlur={() => setFocused(null)}>
                  <option value="">Select a service…</option>
                  <option>Social Content</option>
                  <option>Brand Identity</option>
                  <option>Artist Content</option>
                  <option>White Label</option>
                  <option>Not sure yet</option>
                </select>
              </div>
              <div>
                <label style={{ fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:G, display:'block', marginBottom:6 }}>Brief</label>
                <textarea required rows={4} style={fieldStyle('message')} placeholder="Tell us about your project, goals, and timeline." value={form.message} onChange={e => setForm(f=>({...f, message:e.target.value}))} onFocus={() => setFocused('message')} onBlur={() => setFocused(null)} />
              </div>
              <button type="submit" style={{
                background: accent, color:'#fff',
                fontFamily:"'Space Grotesk',sans-serif", fontSize:14, fontWeight:600,
                padding:'14px', borderRadius:4, border:'none', cursor:'pointer',
                letterSpacing:'0.03em', marginTop:4, transition:'opacity 150ms',
              }}
              onMouseEnter={e => e.target.style.opacity='0.85'}
              onMouseLeave={e => e.target.style.opacity='1'}>
                Send brief →
              </button>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

/* ─── FOOTER ─────────────────────────────────────────────── */
function Footer({ accent }) {
  const year = new Date().getFullYear();
  return (
    <footer style={{ background: B, borderTop:`1px solid ${N}`, padding:'48px 40px 32px' }}>
      <div style={{ maxWidth:1200, margin:'0 auto' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:40, paddingBottom:40, borderBottom:`1px solid ${N}` }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
              <img src="assets/TV_Logo.png" style={{ width:22, height:22, filter:'invert(1)', opacity:0.6 }} alt="TV Productions" />
              <span style={{ fontFamily:"'BebasNeue',sans-serif", fontSize:18, letterSpacing:'0.08em', color:G }}>TV PRODUCTIONS</span>
            </div>
            <div style={{ fontSize:12, color:'#3D3D3D', maxWidth:200, lineHeight:1.7 }}>Social-first video for brands and artists.</div>
          </div>

          <div style={{ display:'flex', gap:48 }}>
            {[
              { head:'Company', links:['Work','Services','About','Contact'] },
              { head:'Services', links:['Social Content','Brand Identity','Artist Content','White Label'] },
              { head:'Connect', links:['Instagram','TikTok','YouTube','Email'] },
            ].map(({ head, links }) => (
              <div key={head} style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:'#3D3D3D', marginBottom:4 }}>{head}</div>
                {links.map(l => (
                  <span key={l} style={{ fontSize:13, color:G, cursor:'pointer', transition:'color 150ms' }}
                    onMouseEnter={e => e.target.style.color=W}
                    onMouseLeave={e => e.target.style.color=G}
                    onClick={() => scrollTo(l.toLowerCase().replace(' ',''))}>
                    {l}
                  </span>
                ))}
              </div>
            ))}
          </div>
        </div>

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div style={{ fontSize:11, color:'#3D3D3D' }}>© {year} TV Productions. All rights reserved.</div>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:10, color:'#3D3D3D' }}>Tanner Vonnahme · tvproductions.co</div>
        </div>
      </div>
    </footer>
  );
}

/* ─── APP ────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakSection, TweakColor, TweakText, TweakToggle } = window;
  const accent = tweaks.accentColor;
  const ctaLabel = tweaks.ctaLabel;

  return (
    <div>
      <TVLogo3D />
      <Header accent={accent} ctaLabel={ctaLabel} />
      <main>
        <Hero accent={accent} ctaLabel={ctaLabel} headline={tweaks.heroHeadline} />
        <ResultsTicker accent={accent} />
        <Work accent={accent} />
        <SocialProof accent={accent} />
        <Services accent={accent} ctaLabel={ctaLabel} />
        {tweaks.showTestimonials && <Testimonials accent={accent} />}
        <About accent={accent} />
        <Contact accent={accent} />
      </main>
      <Footer accent={accent} />

      <TweaksPanel>
        <TweakSection label="Brand">
          <TweakColor id="accentColor" label="Accent color" />
        </TweakSection>
        <TweakSection label="Copy">
          <TweakText id="ctaLabel" label="CTA button label" />
          <TweakText id="heroHeadline" label="Hero headline" />
        </TweakSection>
        <TweakSection label="Sections">
          <TweakToggle id="showTestimonials" label="Show testimonials" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

    <text x="60" y="52" font-family="Arial" font-size="7" fill="#6B6B6B" text-anchor="middle">PRODUCTIONS</text>
  </svg>
</template>
</body>
